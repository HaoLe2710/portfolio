name = "web-portfolio-api-staging"
main = "src/index.ts"
compatibility_date = "2026-10-23"
workers_dev = true

[triggers]
crons = ["*/1 * * * *"]

[observability]
enabled = true

[vars]
CORS_ALLOWED_ORIGINS = "http://localhost:3000"
RELEASE_ENVIRONMENT = "staging"
CLOUDFLARE_ACCOUNT_ID = "bae567c126b6d043659b4c28bd772269"
PAGES_PROJECT_NAME = "web-porfolio"
PAGES_STAGING_BRANCH = "feat/phase4-publish-workflow"
GITHUB_REPOSITORY = "HaoLe2710/portfolio"

[[d1_databases]]
binding = "DB"
database_name = "portfolio_db_staging"
database_id = "e64c898b-0bc0-4e92-8f61-f56d534ff778"
migrations_dir = "migrations"
